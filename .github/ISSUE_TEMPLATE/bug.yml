name: Bug report
description: Report a reproducible problem in EngiBench OpenLab
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS, etc.
  - type: input
    id: hardware
    attributes:
      label: Hardware / board
      placeholder: ESP32 DevKit, Arduino Uno, simulator, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or telemetry sample
      render: shell
